<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Camera Zones</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e24;
      color: #f0f0f5;
      margin: 0;
      padding: 12px;
      user-select: none;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a0a0b0;
    }
    .status {
      font-size: 12px;
      color: #fbbf24;
      margin-bottom: 8px;
    }
    .create-btn {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .create-btn:active {
      background: #4338ca;
    }
    .zone-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 290px;
      overflow-y: auto;
    }
    .zone-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2b2b36;
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 6px solid #ccc;
    }
    .zone-title {
      font-weight: 600;
      font-size: 14px;
      flex-grow: 1;
      margin-right: 8px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }
    .btn-tv { background: #10b981; }
    .btn-tv:active { background: #059669; }
    .btn-lock { background: #3f3f4e; }
    .btn-lock.locked { background: #f59e0b; color: #111; }
    .btn-del { background: #ef4444; }
    .player-msg {
      text-align: center;
      padding: 30px 10px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="gm-ui">
    <h3>Зоны экрана ТВ</h3>
    <div id="status-bar" class="status">Подключение к комнате...</div>
    <button id="add-zone" class="create-btn">+ Создать рамку зоны</button>
    <div id="zones-container" class="zone-list"></div>
  </div>

  <div id="player-ui" class="player-msg" style="display: none;">
    📺 Режим экрана ТВ активен.<br><br>Камера автоматически перемещается по командам Мастера.
  </div>

  <script type="module">
    import OBR, { buildShape } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@1.2.1/+esm";

    const statusBar = document.getElementById("status-bar");
    const META_KEY = "com.custom.tv-zones/isZone";
    const CMD_KEY = "com.custom.tv-zones/targetBounds";
    const COLORS = [
      { hex: "#ef4444", name: "Красная" },
      { hex: "#3b82f6", name: "Синяя" },
      { hex: "#10b981", name: "Зелёная" },
      { hex: "#f59e0b", name: "Жёлтая" },
      { hex: "#a855f7", name: "Фиолетовая" },
      { hex: "#ec4899", name: "Розовая" }
    ];

    let lastTimestamp = 0;

    OBR.onReady(async () => {
      try {
        const role = await OBR.player.getRole();

        // Слушатель команд для ТВ через метаданные сцены (работает на любой версии SDK)
        OBR.scene.onMetadataChange(async (metadata) => {
          const currentRole = await OBR.player.getRole();
          const cmd = metadata[CMD_KEY];
          if (currentRole === "PLAYER" && cmd && cmd.timestamp > lastTimestamp) {
            lastTimestamp = cmd.timestamp;
            await OBR.viewport.animateToBounds(cmd.bounds);
          }
        });

        if (role === "PLAYER") {
          document.getElementById("gm-ui").style.display = "none";
          document.getElementById("player-ui").style.display = "block";
          return;
        }

        statusBar.textContent = "Готово к работе (Мастер)";
        statusBar.style.color = "#10b981";

        const addBtn = document.getElementById("add-zone");
        const container = document.getElementById("zones-container");

        addBtn.addEventListener("click", async () => {
          const isReady = await OBR.scene.isReady();
          if (!isReady) {
            alert("Сначала откройте карту в комнате!");
            return;
          }
          const existing = await getZoneItems();
          const colorObj = COLORS[existing.length % COLORS.length];
          const zoneNumber = existing.length + 1;

          const vpWidth = await OBR.viewport.getWidth();
          const vpHeight = await OBR.viewport.getHeight();
          const center = await OBR.viewport.inverseTransformPoint({
            x: vpWidth / 2,
            y: vpHeight / 2
          });

          const width = 1600;
          const height = 900;

          const shape = buildShape()
            .shapeType("RECTANGLE")
            .width(width)
            .height(height)
            .position({ x: center.x - width / 2, y: center.y - height / 2 })
            .fillColor(colorObj.hex)
            .fillOpacity(0.15)
            .strokeColor(colorObj.hex)
            .strokeWidth(10)
            .strokeOpacity(0.9)
            .layer("DRAWING")
            .visible(false)
            .name(`Зона ${zoneNumber} (${colorObj.name})`)
            .metadata({
              [META_KEY]: {
                index: zoneNumber,
                color: colorObj.hex,
                title: `Зона ${zoneNumber} (${colorObj.name})`
              }
            })
            .build();

          await OBR.scene.items.addItems([shape]);
        });

        async function getZoneItems() {
          const isReady = await OBR.scene.isReady();
          if (!isReady) return [];
          return await OBR.scene.items.getItems(
            (item) => item.metadata && item.metadata[META_KEY] !== undefined
          );
        }

        async function renderZones() {
          const zones = await getZoneItems();
          container.innerHTML = "";

          if (zones.length === 0) {
            container.innerHTML = `<div style="color:#777; font-size:13px; text-align:center; padding:16px;">Нет созданных зон. Нажмите кнопку выше.</div>`;
            return;
          }

          zones.forEach((zone) => {
            const meta = zone.metadata[META_KEY];
            const row = document.createElement("div");
            row.className = "zone-item";
            row.style.borderLeftColor = meta.color;

            const title = document.createElement("div");
            title.className = "zone-title";
            title.textContent = meta.title;

            const btnGroup = document.createElement("div");
            btnGroup.className = "btn-group";

            const tvBtn = document.createElement("button");
            tvBtn.className = "btn btn-tv";
            tvBtn.textContent = "📺 На ТВ";
            tvBtn.onclick = async () => {
              const bounds = await OBR.scene.items.getItemBounds([zone.id]);
              await OBR.scene.setMetadata({
                [CMD_KEY]: {
                  bounds: bounds,
                  timestamp: Date.now()
                }
              });
            };

            const lockBtn = document.createElement("button");
            lockBtn.className = `btn btn-lock ${zone.locked ? "locked" : ""}`;
            lockBtn.textContent = zone.locked ? "🔒" : "🔓";
            lockBtn.onclick = async () => {
              await OBR.scene.items.updateItems([zone.id], (items) => {
                for (let item of items) {
                  item.locked = !item.locked;
                }
              });
            };

            const delBtn = document.createElement("button");
            delBtn.className = "btn btn-del";
            delBtn.textContent = "✕";
            delBtn.onclick = async () => {
              await OBR.scene.items.deleteItems([zone.id]);
            };

            btnGroup.append(tvBtn, lockBtn, delBtn);
            row.append(title, btnGroup);
            container.appendChild(row);
          });
        }

        OBR.scene.items.onChange(renderZones);
        OBR.scene.onReadyChange((ready) => {
          if (ready) renderZones();
        });

        renderZones();
      } catch (err) {
        statusBar.textContent = "Ошибка: " + err.message;
        statusBar.style.color = "#ef4444";
      }
    });
  </script>
</body>
</html>
