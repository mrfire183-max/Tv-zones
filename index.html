<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>TV Camera Zones</title>
        <style>
            body {
                  font-family: system-ui, -apple-system, sans-serif;
                        background: #1e1e24;
                              color: #f0f0f5;
                                    margin: 0;
                                          padding: 12px;
                                                user-select: none;
                                                    }
                                                        h3 {
                                                              margin: 0 0 10px 0;
                                                                    font-size: 15px;
                                                                          text-transform: uppercase;
                                                                                letter-spacing: 0.5px;
                                                                                      color: #a0a0b0;
                                                                                          }
                                                                                              .create-btn {
                                                                                                    width: 100%;
                                                                                                          padding: 12px;
                                                                                                                background: #4f46e5;
                                                                                                                      color: white;
                                                                                                                            border: none;
                                                                                                                                  border-radius: 8px;
                                                                                                                                        font-size: 15px;
                                                                                                                                              font-weight: 600;
                                                                                                                                                    cursor: pointer;
                                                                                                                                                          margin-bottom: 12px;
                                                                                                                                                              }
                                                                                                                                                                  .create-btn:active {
                                                                                                                                                                        background: #4338ca;
                                                                                                                                                                            }
                                                                                                                                                                                .zone-list {
                                                                                                                                                                                      display: flex;
                                                                                                                                                                                            flex-direction: column;
                                                                                                                                                                                                  gap: 8px;
                                                                                                                                                                                                        max-height: 310px;
                                                                                                                                                                                                              overflow-y: auto;
                                                                                                                                                                                                                  }
                                                                                                                                                                                                                      .zone-item {
                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                  align-items: center;
                                                                                                                                                                                                                                        justify-content: space-between;
                                                                                                                                                                                                                                              background: #2b2b36;
                                                                                                                                                                                                                                                    padding: 8px 10px;
                                                                                                                                                                                                                                                          border-radius: 8px;
                                                                                                                                                                                                                                                                border-left: 6px solid #ccc;
                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                        .zone-title {
                                                                                                                                                                                                                                                                              font-weight: 600;
                                                                                                                                                                                                                                                                                    font-size: 14px;
                                                                                                                                                                                                                                                                                          flex-grow: 1;
                                                                                                                                                                                                                                                                                                margin-right: 8px;
                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                        .btn-group {
                                                                                                                                                                                                                                                                                                              display: flex;
                                                                                                                                                                                                                                                                                                                    gap: 6px;
                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                            .btn {
                                                                                                                                                                                                                                                                                                                                  border: none;
                                                                                                                                                                                                                                                                                                                                        border-radius: 6px;
                                                                                                                                                                                                                                                                                                                                              padding: 8px 10px;
                                                                                                                                                                                                                                                                                                                                                    font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                          font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                      color: white;
                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                              .btn-tv {
                                                                                                                                                                                                                                                                                                                                                                                    background: #10b981;
                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                            .btn-tv:active {
                                                                                                                                                                                                                                                                                                                                                                                                  background: #059669;
                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                          .btn-lock {
                                                                                                                                                                                                                                                                                                                                                                                                                background: #3f3f4e;
                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                        .btn-lock.locked {
                                                                                                                                                                                                                                                                                                                                                                                                                              background: #f59e0b;
                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #111;
                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                            .btn-del {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: #ef4444;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                          .player-msg {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 30px 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: #9ca3af;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="gm-ui" style="display: none;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h3>Зоны экрана ТВ</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button id="add-zone" class="create-btn">+ Создать рамку зоны</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div id="zones-container" class="zone-list"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="player-ui" class="player-msg" style="display: none;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              📺 Режим экрана ТВ активен.<br><br>Камера автоматически перемещается по командам Мастера.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <script type="module">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      import OBR, { buildShape } from "https://esm.sh/@owlbear-rodeo/sdk@1.2.1";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const META_KEY = "com.custom.tv-zones/isZone";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const CHANNEL = "com.custom.tv-zones/broadcast";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const COLORS = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { hex: "#ef4444", name: "Красная" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              { hex: "#3b82f6", name: "Синяя" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    { hex: "#10b981", name: "Зелёная" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          { hex: "#f59e0b", name: "Жёлтая" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { hex: "#a855f7", name: "Фиолетовая" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      { hex: "#ec4899", name: "Розовая" }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              OBR.onReady(async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const role = await OBR.player.getRole();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // 1. Слушатель команд для экрана Телевизора (Игроков)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                OBR.broadcast.onMessage(CHANNEL, async (event) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const currentRole = await OBR.player.getRole();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Двигаем камеру ТОЛЬКО у игроков (на ТВ), чтобы на планшете ГМа камера не дергалась
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (currentRole === "PLAYER" && event.data && event.data.bounds) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  await OBR.viewport.animateToBounds(event.data.bounds);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (role === "PLAYER") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("player-ui").style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // 2. Интерфейс Мастера на планшете
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("gm-ui").style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const addBtn = document.getElementById("add-zone");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const container = document.getElementById("zones-container");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Создание новой цветной рамки в центре текущего экрана планшета
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                addBtn.addEventListener("click", async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const existing = await getZoneItems();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const colorObj = COLORS[existing.length % COLORS.length];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const zoneNumber = existing.length + 1;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Определяем центр экрана на планшете ГМа
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const vpWidth = await OBR.viewport.getWidth();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const vpHeight = await OBR.viewport.getHeight();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const center = await OBR.viewport.inverseTransformPoint({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  x: vpWidth / 2,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            y: vpHeight / 2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Размер стартовой рамки 1600x900 (соотношение 16:9 под телевизор)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const width = 1600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const height = 900;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const shape = buildShape()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .shapeType("RECTANGLE")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .width(width)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .height(height)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .position({ x: center.x - width / 2, y: center.y - height / 2 })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .fillColor(colorObj.hex)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .fillOpacity(0.15)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .strokeColor(colorObj.hex)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .strokeWidth(10)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .strokeOpacity(0.9)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .layer("DRAWING")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .visible(false) // Скрыто от игроков на ТВ, но видно Мастеру!
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .name(`Зона ${zoneNumber} (${colorObj.name})`)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .metadata({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  [META_KEY]: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                index: zoneNumber,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: colorObj.hex,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            title: `Зона ${zoneNumber} (${colorObj.name})`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .build();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await OBR.scene.items.addItems([shape]);
